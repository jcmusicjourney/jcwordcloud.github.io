<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字雲｜張學友的形容詞</title>
  <meta name="description" content="說起張學友，你會想到甚麼形容詞？">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --border: #e5e7eb;
      --accent: #1a73e8;
      --text: #0f172a;
      --muted: #475569;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, '微軟正黑體', 'PingFang TC', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 32px 20px 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
    }

    .sub {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 0 16px 36px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 900px) {
      .row {
        grid-template-columns: 400px 1fr;
      }
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }

    .prompt {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 11px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.primary {
      background: linear-gradient(180deg, #1a73e8, #0f62d0);
      border-color: #0f62d0;
      color: #fff;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .message {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13px;
    }

    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }

    .toolbar {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .badge {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .badge strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      color: var(--text);
    }

    .top-list {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .top-list h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .top-list ol {
      margin: 0;
      padding-left: 20px;
    }

    .top-list li {
      padding: 4px 0;
      color: var(--muted);
    }

    .top-list li strong {
      color: var(--text);
    }

    .cloud-card {
      display: flex;
      flex-direction: column;
    }

    .cloud-wrap {
      flex: 1;
      min-height: 440px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    #cloud {
      display: block;
      width: 100%;
      height: 100%;
    }

    footer {
      padding: 18px 16px 30px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js" defer></script>
</head>

<body>
  <header>
    <h1>說起「張學友」，你會想到甚麼形容詞？</h1>
    <p class="sub">輸入你的答案，一起建立文字雲。</p>
  </header>

  <main class="container">
    <div class="row">
      <section class="card">
        <div class="prompt">
          <label for="answer">請輸入形容詞</label>

          <div class="input-wrap">
            <input
              id="answer"
              type="text"
              placeholder="例如：溫柔、專業、細膩、動人"
              maxlength="200"
              autocomplete="off"
            >
            <button class="btn primary" id="submitBtn">確定</button>
          </div>

          <p class="hint">
            可用空格、逗號、頓號或分號分隔多個詞；每次最多 10 個詞，每個詞最多 20 字。
          </p>

          <div class="message" id="message" role="status" aria-live="polite"></div>
        </div>

        <div class="stats">
          <div class="badge">
            詞彙總數
            <strong id="totalWords">0</strong>
          </div>

          <div class="badge">
            唯一詞彙
            <strong id="uniqueWords">0</strong>
          </div>
        </div>

        <div class="top-list">
          <h2>熱門形容詞 TOP 10</h2>
          <ol id="topList"></ol>
        </div>
      </section>

      <section class="card cloud-card">
        <div class="toolbar">
          <button class="btn" id="refreshBtn">手動更新文字雲</button>
        </div>

        <div class="cloud-wrap">
          <svg
            id="cloud"
            viewBox="0 0 640 440"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-label="張學友形容詞文字雲"
          ></svg>
        </div>
      </section>
    </div>
  </main>

  <footer>
    © 2025 文字雲遊戲 · Firebase Realtime Database
  </footer>

  <script>
    'use strict';

    const MAX_WORDS_PER_SUBMIT = 10;
    const MAX_WORD_LENGTH = 20;
    const MAX_DISPLAY_WORDS = 120;
    const RENDER_DELAY = 300;

    const state = {
      counts: new Map(),
      pendingWrites: new Set(),
      submitting: false
    };

    const answerInput = document.getElementById('answer');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const messageEl = document.getElementById('message');
    const totalWordsEl = document.getElementById('totalWords');
    const uniqueWordsEl = document.getElementById('uniqueWords');
    const topListEl = document.getElementById('topList');
    const svgEl = document.getElementById('cloud');

    const WIDTH = 640;
    const HEIGHT = 440;

    function showMessage(text, type = '') {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function splitTokens(input) {
      if (!input) return [];

      return input
        .replace(/[\n\r]+/g, ' ')
        .split(/[\s,，；;、]+/)
        .map(token => token.trim())
        .filter(Boolean);
    }

    function normalizeWord(word) {
      return word
        .replace(/[\uff01-\uff5e]/g, char =>
          String.fromCharCode(char.charCodeAt(0) - 0xFEE0)
        )
        .toLowerCase()
        .trim();
    }

    function isValidWord(word) {
      return (
        word.length > 0 &&
        word.length <= MAX_WORD_LENGTH &&
        !/[<>"/'\\]/.test(word)
      );
    }

    function hashString(text) {
      let hash = 0;

      for (let i = 0; i < text.length; i++) {
        hash = (hash << 5) - hash + text.charCodeAt(i);
        hash |= 0;
      }

      return Math.abs(hash);
    }

    function colorForWord(word) {
      const hue = hashString(word) % 360;
      return `hsl(${hue}, 70%, 40%)`;
    }

    let renderQueued = false;

    function scheduleRender() {
      if (renderQueued) return;

      renderQueued = true;

      setTimeout(() => {
        renderQueued = false;
        renderCloud();
      }, RENDER_DELAY);
    }

    function renderCloud() {
      if (!window.d3 || !window.d3.layout || !window.d3.layout.cloud) {
        setTimeout(renderCloud, 100);
        return;
      }

      const words = Array.from(state.counts.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, MAX_DISPLAY_WORDS)
        .map(([word, count]) => ({ text: word, count }));

      d3.select(svgEl).selectAll('*').remove();

      if (words.length === 0) {
        d3.select(svgEl)
          .append('text')
          .attr('x', WIDTH / 2)
          .attr('y', HEIGHT / 2)
          .attr('text-anchor', 'middle')
          .attr('fill', '#94a3b8')
          .style('font-size', '16px')
          .text('還沒有資料，請輸入形容詞！');
        return;
      }

      const maxCount = d3.max(words, item => item.count) || 1;
      const minCount = d3.min(words, item => item.count) || 1;

      const fontScale = d3
        .scaleLinear()
        .domain([minCount, maxCount])
        .range([16, 86]);

      d3.layout.cloud()
        .size([WIDTH, HEIGHT])
        .words(words.map(item => ({
          text: item.text,
          count: item.count,
          size: fontScale(item.count)
        })))
        .padding(3)
        .rotate(() => (Math.random() < 0.88 ? 0 : 90))
        .spiral('archimedean')
        .font('Noto Sans TC')
        .fontSize(item => item.size)
        .on('end', laidOutWords => {
          const group = d3
            .select(svgEl)
            .append('g')
            .attr('transform', `translate(${WIDTH / 2}, ${HEIGHT / 2})`);

          group
            .selectAll('text')
            .data(laidOutWords)
            .enter()
            .append('text')
            .style('font-size', item => `${item.size}px`)
            .style('font-family', "'Noto Sans TC', system-ui")
            .style('fill', item => colorForWord(item.text))
            .attr('text-anchor', 'middle')
            .attr('transform', item =>
              `translate(${item.x}, ${item.y}) rotate(${item.rotate})`
            )
            .text(item => item.text)
            .append('title')
            .text(item => `${item.text}：${item.count} 次`);
        })
        .start();
    }

    function renderStats() {
      const entries = Array.from(state.counts.entries());
      const total = entries.reduce((sum, [, count]) => sum + count, 0);

      totalWordsEl.textContent = String(total);
      uniqueWordsEl.textContent = String(state.counts.size);

      topListEl.replaceChildren();

      entries
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .forEach(([word, count]) => {
          const listItem = document.createElement('li');
          const wordEl = document.createElement('strong');

          wordEl.textContent = word;
          listItem.append(wordEl, document.createTextNode(` — ${count}`));
          topListEl.append(listItem);
        });
    }

    async function submitAnswer() {
      if (state.submitting) return;

      const rawInput = answerInput.value.trim();

      if (!rawInput) {
        showMessage('請先輸入至少一個形容詞。', 'error');
        answerInput.focus();
        return;
      }

      const tokens = splitTokens(rawInput);

      if (tokens.length === 0) {
        showMessage('請輸入有效的形容詞。', 'error');
        return;
      }

      if (tokens.length > MAX_WORDS_PER_SUBMIT) {
        showMessage(`每次最多提交 ${MAX_WORDS_PER_SUBMIT} 個詞。`, 'error');
        return;
      }

      const validWords = [];
      let invalidCount = 0;

      tokens.forEach(originalWord => {
        const word = normalizeWord(originalWord);

        if (isValidWord(word)) {
          validWords.push(word);
        } else {
          invalidCount += 1;
        }
      });

      if (validWords.length === 0) {
        showMessage('沒有可提交的有效詞彙。', 'error');
        return;
      }

      state.submitting = true;
      submitBtn.disabled = true;
      showMessage('正在提交…');

      const results = await Promise.all(
        validWords.map(word => window.firebasePushWord(word))
      );

      const successCount = results.filter(Boolean).length;
      const failureCount = results.length - successCount;

      validWords.forEach(word => {
        state.counts.set(word, (state.counts.get(word) || 0) + 1);
        state.pendingWrites.add(word);
      });

      renderStats();
      scheduleRender();

      if (failureCount === 0) {
        showMessage(`已成功提交 ${successCount} 個形容詞。`, 'success');
      } else if (successCount === 0) {
        showMessage('提交失敗，請檢查網路後稍後再試。', 'error');
      } else {
        showMessage(
          `成功提交 ${successCount} 個，另有 ${failureCount} 個失敗。`,
          'error'
        );
      }

      if (invalidCount > 0) {
        showMessage(
          `有 ${invalidCount} 個詞因格式或長度不符合而未提交。`,
          'error'
        );
      }

      answerInput.value = '';
      answerInput.focus();

      state.submitting = false;
      submitBtn.disabled = false;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderStats();
      renderCloud();

      submitBtn.addEventListener('click', submitAnswer);

      answerInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitAnswer();
        }
      });

      refreshBtn.addEventListener('click', () => {
        if (typeof window.loadOnceFromFirebase === 'function') {
          showMessage('正在更新文字雲…');
          window.loadOnceFromFirebase();
        }
      });
    });
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
    import {
      getDatabase,
      ref,
      push,
      get
    } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDO429O2JfwCLLveTPsg9eR2NZKdOKjPdA",
      authDomain: "jcwordcloud.firebaseapp.com",
      databaseURL: "https://jcwordcloud-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "jcwordcloud",
      storageBucket: "jcwordcloud.firebasestorage.app",
      messagingSenderId: "585386416126",
      appId: "1:585386416126:web:5eda0b9228daad218dd2af",
      measurementId: "G-S8KMDFZ7NP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ROOM_ID = 'jacky-cheung-adjectives';
    const wordsRef = ref(db, `rooms/${ROOM_ID}/words`);

    window.firebasePushWord = async function (normalizedWord) {
      try {
        await push(wordsRef, {
          word: normalizedWord,
          ts: Date.now()
        });

        return true;
      } catch (error) {
        console.warn('Firebase write failed:', error);
        return false;
      }
    };

    function mergePendingWrites(countsMap) {
      state.pendingWrites.forEach(word => {
        countsMap.set(word, (countsMap.get(word) || 0) + 1);
      });

      return countsMap;
    }

    window.loadOnceFromFirebase = async function () {
      try {
        const snapshot = await get(wordsRef);
        const records = snapshot.val() || {};

        const cloudCounts = new Map();

        Object.values(records).forEach(record => {
          if (
            record &&
            typeof record.word === 'string' &&
            record.word.length > 0 &&
            record.word.length <= 20
          ) {
            const word = record.word;
            cloudCounts.set(word, (cloudCounts.get(word) || 0) + 1);
          }
        });

        if (cloudCounts.size === 0) {
          if (state.counts.size > 0) {
            showMessage('雲端暫時沒有資料，已保留目前畫面。', 'error');
          } else {
            showMessage('雲端暫時沒有資料。');
          }

          renderStats();
          scheduleRender();
          return;
        }

        state.counts = mergePendingWrites(cloudCounts);
        state.pendingWrites.clear();

        renderStats();
        scheduleRender();
        showMessage('文字雲已更新。', 'success');
      } catch (error) {
        console.warn('Firebase read failed:', error);
        showMessage('無法讀取雲端資料，已保留目前畫面。', 'error');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      window.loadOnceFromFirebase();
    });

    const FIVE_MINUTES = 5 * 60 * 1000;

    setInterval(() => {
      if (document.visibilityState === 'visible') {
        window.loadOnceFromFirebase();
      }
    }, FIVE_MINUTES);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        window.loadOnceFromFirebase();
      }
    });
  </script>
</body>
</html>
