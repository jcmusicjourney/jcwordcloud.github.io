<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字雲｜張學友的形容詞</title>
  <meta name="description" content="說起張學友，你會想到甚麼形容詞？提交你的答案，一起建立文字雲。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --accent: #1a73e8;
      --accent-dark: #0f62d0;
      --text: #0f172a;
      --muted: #475569;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, '微軟正黑體', 'PingFang TC', sans-serif;
      line-height: 1.5;
    }

    header {
      padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 32px) 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2rem + 1.5vw, 2.1rem);
      line-height: 1.3;
      letter-spacing: .2px;
    }

    .sub {
      max-width: 680px;
      margin: clamp(8px, 2vw, 14px) auto 0;
      padding: 0 clamp(16px, 4vw, 32px);
      color: var(--muted);
      font-size: clamp(.85rem, .8rem + .35vw, .95rem);
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(12px, 3vw, 24px) clamp(12px, 3vw, 24px) clamp(24px, 5vw, 40px);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(12px, 2.5vw, 18px);
      align-items: start;
    }

    @media (min-width: 900px) {
      .layout {
        grid-template-columns: minmax(320px, 400px) minmax(0, 1fr);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(14px, 3vw, 20px);
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }

    .prompt {
      padding: clamp(12px, 3vw, 18px);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: clamp(1rem, .95rem + .3vw, 1.05rem);
      font-weight: 700;
    }

    .input-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 560px) {
      .input-group {
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
      }
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color .2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-dark));
      border-color: var(--accent-dark);
      color: #fff;
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(.72rem, .7rem + .2vw, .8rem);
      line-height: 1.55;
    }

    .message {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(.8rem, .78rem + .2vw, .88rem);
    }

    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: clamp(10px, 2vw, 14px);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 2vw, 12px);
      margin-top: clamp(12px, 3vw, 18px);
    }

    .badge {
      padding: clamp(10px, 2vw, 12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: clamp(.72rem, .7rem + .2vw, .8rem);
    }

    .badge strong {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: clamp(1.1rem, 1rem + .8vw, 1.35rem);
      line-height: 1.2;
    }

    .top-list {
      margin-top: clamp(12px, 3vw, 18px);
      padding: clamp(12px, 3vw, 16px);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .top-list h2 {
      margin: 0 0 10px;
      font-size: clamp(1rem, .95rem + .3vw, 1.1rem);
    }

    .top-list ol {
      margin: 0;
      padding-left: 20px;
    }

    .top-list li {
      padding: 4px 0;
      color: var(--muted);
      font-size: clamp(.85rem, .82rem + .25vw, .95rem);
    }

    .top-list li strong {
      color: var(--text);
    }

    .cloud-card {
      display: flex;
      flex-direction: column;
    }

    .cloud-wrap {
      flex: 1;
      width: 100%;
      min-height: 320px;
      aspect-ratio: 4 / 5;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    @media (min-width: 700px) {
      .cloud-wrap {
        aspect-ratio: 16 / 11;
      }
    }

    @media (min-width: 1024px) {
      .cloud-wrap {
        aspect-ratio: 16 / 9;
      }
    }

    #cloud {
      display: block;
      width: 100%;
      height: 100%;
    }

    footer {
      padding: clamp(14px, 3vw, 22px) 16px clamp(22px, 4vw, 34px);
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    @media (max-width: 359px) {
      .btn {
        padding: 12px 12px;
        font-size: 15px;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js" defer></script>
</head>

<body>
  <header>
    <h1>說起「張學友」，你會想到甚麼形容詞？</h1>
    <p class="sub">
      輸入你的答案，一起建立文字雲。你的形容詞會寫入雲端，文字雲每 5 分鐘更新一次。
    </p>
  </header>

  <main class="container">
    <div class="layout">
      <section class="card">
        <div class="prompt">
          <label for="answer">請輸入形容詞</label>

          <div class="input-group">
            <input
              id="answer"
              type="text"
              placeholder="例如：溫柔、專業、細膩、動人"
              maxlength="200"
              autocomplete="off"
              inputmode="text"
            >

            <button class="btn btn-primary" id="submitBtn" type="button">
              確定
            </button>

            <button class="btn" id="refreshBtn" type="button">
              更新
            </button>
          </div>

          <p class="hint">
            可用空格、逗號、頓號或分號分隔多個詞。每次最多 10 個詞，每個詞最多 20 字。
          </p>

          <div class="message" id="message" role="status" aria-live="polite"></div>
        </div>

        <div class="stats">
          <div class="badge">
            雲端詞彙總數
            <strong id="totalWords">0</strong>
          </div>

          <div class="badge">
            唯一詞彙
            <strong id="uniqueWords">0</strong>
          </div>
        </div>

        <div class="top-list">
          <h2>熱門形容詞 TOP 10</h2>
          <ol id="topList"></ol>
        </div>
      </section>

      <section class="card cloud-card">
        <div class="cloud-wrap">
          <svg
            id="cloud"
            viewBox="0 0 640 440"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-label="張學友形容詞文字雲"
          ></svg>
        </div>
      </section>
    </div>
  </main>

  <footer>
    © 2026 張學友音樂世界 · 非官方粉絲網頁
  </footer>

  <script>
    'use strict';

    const MAX_WORDS_PER_SUBMIT = 10;
    const MAX_WORD_LENGTH = 20;
    const MAX_DISPLAY_WORDS = 120;
    const RENDER_DELAY = 250;
    const RESIZE_DELAY = 250;

    const state = {
      counts: new Map(),
      pendingWrites: new Set(),
      submitting: false
    };

    const answerInput = document.getElementById('answer');
    const submitBtn = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const messageEl = document.getElementById('message');
    const totalWordsEl = document.getElementById('totalWords');
    const uniqueWordsEl = document.getElementById('uniqueWords');
    const topListEl = document.getElementById('topList');
    const svgEl = document.getElementById('cloud');

    function showMessage(text, type = '') {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function splitTokens(input) {
      if (!input) return [];

      return input
        .replace(/[\n\r]+/g, ' ')
        .split(/[\s,，；;、]+/)
        .map(token => token.trim())
        .filter(Boolean);
    }

    function normalizeWord(word) {
      return word
        .replace(/[\uff01-\uff5e]/g, char =>
          String.fromCharCode(char.charCodeAt(0) - 0xFEE0)
        )
        .toLowerCase()
        .trim();
    }

    function isValidWord(word) {
      return (
        word.length > 0 &&
        word.length <= MAX_WORD_LENGTH &&
        !/[<>"/'\\]/.test(word)
      );
    }

    function hashString(text) {
      let hash = 0;

      for (let i = 0; i < text.length; i++) {
        hash = (hash << 5) - hash + text.charCodeAt(i);
        hash |= 0;
      }

      return Math.abs(hash);
    }

    function colorForWord(word) {
      const hue = hashString(word) % 360;
      return `hsl(${hue}, 70%, 40%)`;
    }

    function getCloudSize() {
      const rect = svgEl.getBoundingClientRect();

      const width = Math.max(
        280,
        Math.round(rect.width || window.innerWidth)
      );

      const height = Math.max(
        280,
        Math.round(rect.height || window.innerHeight * 0.6)
      );

      return { width, height };
    }

    let renderQueued = false;

    function scheduleRender() {
      if (renderQueued) return;

      renderQueued = true;

      setTimeout(() => {
        renderQueued = false;
        renderCloud();
      }, RENDER_DELAY);
    }

    function renderCloud() {
      if (!window.d3 || !window.d3.layout || !window.d3.layout.cloud) {
        setTimeout(renderCloud, 100);
        return;
      }

      const { width, height } = getCloudSize();
      const isSmallScreen = width < 520;

      const words = Array.from(state.counts.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, MAX_DISPLAY_WORDS)
        .map(([word, count]) => ({ text: word, count }));

      d3.select(svgEl).selectAll('*').remove();

      if (words.length === 0) {
        d3.select(svgEl)
          .attr('viewBox', `0 0 ${width} ${height}`)
          .append('text')
          .attr('x', width / 2)
          .attr('y', height / 2)
          .attr('text-anchor', 'middle')
          .attr('fill', '#94a3b8')
          .style('font-size', isSmallScreen ? '14px' : '16px')
          .text('還沒有資料，請輸入形容詞！');

        return;
      }

      const maxCount = d3.max(words, item => item.count) || 1;
      const minCount = d3.min(words, item => item.count) || 1;

      const minFontSize = isSmallScreen ? 13 : 16;
      const maxFontSize = isSmallScreen ? 54 : 86;

      const fontScale = d3
        .scaleLinear()
        .domain([minCount, maxCount])
        .range([minFontSize, maxFontSize]);

      d3.layout.cloud()
        .size([width, height])
        .words(words.map(item => ({
          text: item.text,
          count: item.count,
          size: fontScale(item.count)
        })))
        .padding(isSmallScreen ? 2 : 3)
        .rotate(() => {
          const verticalChance = isSmallScreen ? 0.06 : 0.12;
          return Math.random() < verticalChance ? 90 : 0;
        })
        .spiral('archimedean')
        .font('Noto Sans TC')
        .fontSize(item => item.size)
        .on('end', laidOutWords => {
          d3.select(svgEl)
            .attr('viewBox', `0 0 ${width} ${height}`)
            .attr('preserveAspectRatio', 'xMidYMid meet');

          const group = d3
            .select(svgEl)
            .append('g')
            .attr('transform', `translate(${width / 2}, ${height / 2})`);

          group
            .selectAll('text')
            .data(laidOutWords)
            .enter()
            .append('text')
            .style('font-size', item => `${item.size}px`)
            .style('font-family', "'Noto Sans TC', system-ui")
            .style('fill', item => colorForWord(item.text))
            .attr('text-anchor', 'middle')
            .attr('transform', item =>
              `translate(${item.x}, ${item.y}) rotate(${item.rotate})`
            )
            .text(item => item.text)
            .append('title')
            .text(item => `${item.text}：${item.count} 次`);
        })
        .start();
    }

    function renderStats() {
      const entries = Array.from(state.counts.entries());
      const total = entries.reduce((sum, [, count]) => sum + count, 0);

      totalWordsEl.textContent = String(total);
      uniqueWordsEl.textContent = String(state.counts.size);

      topListEl.replaceChildren();

      entries
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .forEach(([word, count]) => {
          const listItem = document.createElement('li');
          const wordEl = document.createElement('strong');

          wordEl.textContent = word;
          listItem.append(wordEl, document.createTextNode(` — ${count}`));
          topListEl.append(listItem);
        });
    }

    async function submitAnswer() {
      if (state.submitting) return;

      const rawInput = answerInput.value.trim();

      if (!rawInput) {
        showMessage('請先輸入至少一個形容詞。', 'error');
        answerInput.focus();
        return;
      }

      const tokens = splitTokens(rawInput);

      if (tokens.length === 0) {
        showMessage('請輸入有效的形容詞。', 'error');
        return;
      }

      if (tokens.length > MAX_WORDS_PER_SUBMIT) {
        showMessage(`每次最多提交 ${MAX_WORDS_PER_SUBMIT} 個詞。`, 'error');
        return;
      }

      const validWords = [];
      let invalidCount = 0;

      tokens.forEach(originalWord => {
        const word = normalizeWord(originalWord);

        if (isValidWord(word)) {
          validWords.push(word);
        } else {
          invalidCount += 1;
        }
      });

      if (validWords.length === 0) {
        showMessage('沒有可提交的有效詞彙。', 'error');
        return;
      }

      state.submitting = true;
      submitBtn.disabled = true;
      showMessage('正在提交…');

      const results = await Promise.all(
        validWords.map(word => window.firebasePushWord(word))
      );

      const successCount = results.filter(Boolean).length;
      const failureCount = results.length - successCount;

      validWords.forEach(word => {
        state.counts.set(word, (state.counts.get(word) || 0) + 1);
        state.pendingWrites.add(word);
      });

      renderStats();
      scheduleRender();

      if (failureCount === 0) {
        showMessage(`已成功提交 ${successCount} 個形容詞。`, 'success');
      } else if (successCount === 0) {
        showMessage('提交失敗，請檢查網路後稍後再試。', 'error');
      } else {
        showMessage(
          `成功提交 ${successCount} 個，另有 ${failureCount} 個失敗。`,
          'error'
        );
      }

      if (invalidCount > 0) {
        showMessage(
          `有 ${invalidCount} 個詞因格式或長度不符合而未提交。`,
          'error'
        );
      }

      answerInput.value = '';
      answerInput.focus();

      state.submitting = false;
      submitBtn.disabled = false;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderStats();
      renderCloud();

      submitBtn.addEventListener('click', submitAnswer);

      answerInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitAnswer();
        }
      });

      refreshBtn.addEventListener('click', () => {
        if (typeof window.loadOnceFromFirebase === 'function') {
          showMessage('正在更新文字雲…');
          window.loadOnceFromFirebase();
        }
      });
    });

    let resizeTimer;

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(scheduleRender, RESIZE_DELAY);
    });

    window.addEventListener('orientationchange', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(scheduleRender, RESIZE_DELAY);
    });
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
    import {
      getDatabase,
      ref,
      push,
      get
    } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDO429O2JfwCLLveTPsg9eR2NZKdOKjPdA",
      authDomain: "jcwordcloud.firebaseapp.com",
      databaseURL: "https://jcwordcloud-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "jcwordcloud",
      storageBucket: "jcwordcloud.firebasestorage.app",
      messagingSenderId: "585386416126",
      appId: "1:585386416126:web:5eda0b9228daad218dd2af",
      measurementId: "G-S8KMDFZ7NP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ROOM_ID = 'jacky-cheung-adjectives';
    const wordsRef = ref(db, `rooms/${ROOM_ID}/words`);

    window.firebasePushWord = async function (normalizedWord) {
      try {
        await push(wordsRef, {
          word: normalizedWord,
          ts: Date.now()
        });

        return true;
      } catch (error) {
        console.warn('Firebase write failed:', error);
        return false;
      }
    };

    function mergePendingWrites(countsMap) {
      state.pendingWrites.forEach(word => {
        countsMap.set(word, (countsMap.get(word) || 0) + 1);
      });

      return countsMap;
    }

    window.loadOnceFromFirebase = async function () {
      try {
        const snapshot = await get(wordsRef);
        const records = snapshot.val() || {};

        const cloudCounts = new Map();

        Object.values(records).forEach(record => {
          if (
            record &&
            typeof record.word === 'string' &&
            record.word.length > 0 &&
            record.word.length <= 20
          ) {
            const word = record.word;
            cloudCounts.set(word, (cloudCounts.get(word) || 0) + 1);
          }
        });

        if (cloudCounts.size === 0) {
          if (state.counts.size > 0) {
            showMessage('雲端暫時沒有資料，已保留目前畫面。', 'error');
          } else {
            showMessage('雲端暫時沒有資料。');
          }

          renderStats();
          scheduleRender();
          return;
        }

        state.counts = mergePendingWrites(cloudCounts);
        state.pendingWrites.clear();

        renderStats();
        scheduleRender();
        showMessage('文字雲已更新。', 'success');
      } catch (error) {
        console.warn('Firebase read failed:', error);
        showMessage('無法讀取雲端資料，已保留目前畫面。', 'error');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      window.loadOnceFromFirebase();
    });

    const FIVE_MINUTES = 5 * 60 * 1000;

    setInterval(() => {
      if (document.visibilityState === 'visible') {
        window.loadOnceFromFirebase();
      }
    }, FIVE_MINUTES);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        window.loadOnceFromFirebase();
      }
    });
  </script>
</body>
</html>
